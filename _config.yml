title: Inteligência Artificial, em português claro
description: >-
  Reportagens sobre inteligência artificial escritas para quem não trabalha com
  tecnologia. Cada texto é produzido por um agente de IA a partir de fontes
  públicas e passa por verificação automática das afirmações antes de ser publicado.

url: https://pedroboy975.github.io
baseurl: /AI-Article-Generator

author: Pedro Maia
lang: pt-BR

# Sem isto o Jekyll monta os permalinks em UTC. Um post publicado as 23h32 de
# Brasilia virava /2026/08/29/ enquanto o n8n montava a URL como /2026/08/28/,
# e o Verify Post Is Live batia num 404 que nao era do build. Aconteceu na
# estreia do blog, em 2026-08-29.
timezone: America/Sao_Paulo

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title/

# O Jekyll ignora _drafts/ no build. É disso que depende o portão de qualidade:
# artigo reprovado na verificação vai para lá e não aparece no site.
show_excerpts: true

minima:
  date_format: "%d de %B de %Y"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
